name: E2E Tests — Playwright + BDD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (chromium + firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Generate BDD tests
        run: npx bddgen

      - name: Run E2E tests
        run: npx playwright test
        env:
          # Credenciais público do app demo entram por secret de CI
          # (Saucedemo é um app de treinamento; nunca usar dados reais).
          BASE_URL: https://www.saucedemo.com

      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results -o allure-report --clean

      - name: Upload Playwright report (artefato HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report (artefato HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload trace de falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14