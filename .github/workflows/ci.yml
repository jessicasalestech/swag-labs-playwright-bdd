name: E2E Tests — Playwright + BDD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # publish the Allure report on GitHub Pages
  id-token: write   # required by actions/deploy-pages

# Avoids simultaneous Pages deploys when there are rapid pushes
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (chromium + firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Generate BDD tests
        run: npx bddgen

      - name: Run E2E tests
        run: npx playwright test
        env:
          # Public demo app credentials come through a CI secret
          # (Saucedemo is a training app; never use real data).
          BASE_URL: https://www.saucedemo.com

      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results -o allure-report --clean

      - name: Upload Playwright report (HTML artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report (HTML artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v6
        with:
          enablement: true  # enables Pages automatically on the first run

      - name: Upload Allure report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload failure trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14